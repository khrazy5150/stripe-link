            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RefundsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LedgerTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ServicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref CalendarConnectionsTable
        - Statement:
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !GetAtt StripeKeysEncryptionKey.Arn
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:jb/google-oauth/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref WebhookEventsTable
        - S3ReadPolicy:
            BucketName: !Ref ConfigBucket
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - sesv2:SendEmail
              Resource: "*"
        - !If
          - HasStripePlatformSecret
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref StripePlatformSecretArn
          - !Ref AWS::NoValue
      Events:
        StripeConnectWebhookPreview:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /webhook/stripe-preview
            Method: POST
        StripeConnectWebhookStable:
          Type: Api
          Properties:
