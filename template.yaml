    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-stripe-webhook-${Environment}"
      CodeUri: src/
      Handler: handlers.stripe_webhook.handler
      Description: Receives Stripe Connect webhook events.
      Policies:
        # CRUD (not Read): account.updated persists Connect verification state onto the stripe_keys doc.
        - DynamoDBCrudPolicy:
            TableName: !Ref StripeKeysTable
        # account.updated also auto-seeds the business NAP (user_profile) and recomputes Site eligibility.
