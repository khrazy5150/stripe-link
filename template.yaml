        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
        - S3ReadPolicy:
            BucketName: !Ref ConfigBucket
        - Statement:
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !GetAtt StripeKeysEncryptionKey.Arn
        - Statement:
