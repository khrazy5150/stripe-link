AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: stripe-link - JSON-first Stripe Cart rebuild

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment.
  ProjectPrefix:
    Type: String
    Default: jb
    AllowedValues:
      - jb
    Description: Prefix used to isolate stripe-link resources from stripe-cart.
  PlatformHostingDomain:
    Type: String
    Default: jbay.uk
    Description: Registrable domain for tenant free-tier Sites (Zone B, always noindex). A tenant's platform_hostname is <name>.<this>. Must differ from the platform's own domain (juniorbay.com). See plans/SITE_OBJECT.md.
  PlatformServingEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether Sites are served on their free platform host (<name>.<PlatformHostingDomain>). Gates storefront chrome, relative-link home_url, and funnel slug-attach on the platform host. Keep "false" until the *.<PlatformHostingDomain> Cloudflare Worker route is live, then flip per environment. See plans/PLATFORM_HOSTNAME_SERVING.md.
  StripeClientId:
    Type: String
    Default: ""
    Description: Legacy Stripe Connect live OAuth client ID.
  StripeClientIdTest:
    Type: String
    Default: ""
    Description: Stripe Connect test OAuth client ID.
  StripeClientIdLive:
    Type: String
    Default: ""
    Description: Stripe Connect live OAuth client ID.
  CalendarRedirectUri:
    Type: String
    Default: ""
    Description: OAuth redirect URI for Google Calendar connect (must be registered in the Google OAuth client). e.g. https://dev.juniorbay.com/calendar/callback

  StripeConnectRedirectUri:
    Type: String
    Default: ""
    Description: Stripe Connect OAuth redirect URI.
  StripePlatformSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing Junior Bay platform Stripe secret keys.
  PlatformBillingMode:
    Type: String
    Default: live
    AllowedValues: [test, live]
    Description: The platform's OWN Stripe mode for billing tenants their SaaS subscription (distinct from a tenant's storefront mode). Set 'test' on dev to exercise billing against Stripe test plans/prices; 'live' in production.
  TrialPeriodDays:
    Type: Number
    Default: 14
    Description: Length of the free platform trial a new tenant gets before the subscribe wall. Use a short value (e.g. 1) on dev to test the wall quickly; 14 in production. Only affects NEW signups.
  ApiCustomDomainName:
    Type: String
    Default: ""
    Description: Optional API Gateway custom domain name, such as dev.juniorbay.com.
  ApiCustomDomainCertificateArn:
    Type: String
    Default: ""
    Description: Optional regional ACM certificate ARN for the API Gateway custom domain.
  ApiCustomDomainHostedZoneName:
    Type: String
    Default: juniorbay.com.
    Description: Route 53 hosted zone name used for the API custom domain alias record.
  DashboardCustomDomainName:
    Type: String
    Default: ""
    Description: Optional CloudFront custom domain name for the dashboard, such as dashboard.juniorbay.com.
  DashboardCustomDomainCertificateArn:
    Type: String
    Default: ""
    Description: Optional us-east-1 ACM certificate ARN for the dashboard CloudFront distribution.
  DashboardCustomDomainHostedZoneName:
    Type: String
    Default: juniorbay.com.
    Description: Route 53 hosted zone name used for the dashboard custom domain alias record.
  PreviewCustomDomainCertificateArn:
    Type: String
    Default: ""
    Description: us-east-1 ACM cert ARN for the preview distribution's {stage}-live alias (the *.juniorbay.com wildcard). Required when PreviewLiveDomainName is set.
  PreviewCustomDomainHostedZoneName:
    Type: String
    Default: juniorbay.com.
    Description: Route 53 hosted zone name used for the preview live-host alias record.
  PreviewLiveDomainName:
    Type: String
    Default: ""
    Description: The canonical {stage}-live preview host on this stack's preview CloudFront dist (dev-live / prod-live.juniorbay.com); uses the us-east-1 wildcard cert (PreviewCustomDomainCertificateArn). (plans/SERVE_HOST_SCHEME.md)
  TestServeDomainName:
    Type: String
    Default: ""
    Description: Optional regional API Gateway custom domain for the test-mode page viewer (TestPageServeFunction), such as prod-test.juniorbay.com. Maps to this stack's RestApi. DNS in Route 53. (plans/SERVE_HOST_SCHEME.md)
  TestServeCertificateArn:
    Type: String
    Default: ""
    Description: Optional us-west-2 (REGIONAL) ACM cert ARN covering TestServeDomainName (the us-west-2 *.juniorbay.com wildcard).
  TestServeHostedZoneName:
    Type: String
    Default: juniorbay.com.
    Description: Route 53 hosted zone name used for the test-serve custom domain alias record.
  HomepageEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to create the public marketing homepage bucket + CloudFront distribution (prod only). Copy is deployed via deploy/deploy-homepage.sh (S3 sync), independent of this stack. See plans/HOMEPAGE.md
  HomepageCustomDomainName:
    Type: String
    Default: ""
    Description: Apex marketing host (juniorbay.com). Doubles as the cutover TOGGLE -- empty = Phase 1 (distribution serves on *.cloudfront.net only, no apex alias); set = Phase 2 (claims the apex + www alias and Route 53 records). Free the CNAME off the old apex distribution (E1VGTULTFA3BO3) before setting this.
  HomepageCustomDomainCertificateArn:
    Type: String
    Default: ""
    Description: us-east-1 ACM cert covering the apex homepage host + www (reuse the 1a72b7c6 cert, whose SANs include the bare juniorbay.com apex). Required for Phase 2.
  HomepageCustomDomainHostedZoneName:
    Type: String
    Default: juniorbay.com.
    Description: Route 53 hosted zone name used for the homepage apex + www alias records.
  CognitoUserPoolId:
    Type: String
    Default: us-west-2_gBemPnEF8
    Description: Existing Cognito user pool used as the dashboard auth gatekeeper.
  CognitoUserPoolClientId:
    Type: String
    Default: 2cusn1634kl6hqgn78r0h346m0
    Description: Existing Cognito app client ID used by the dashboard auth API.
  CloudflareZoneId:
    Type: String
    Default: ""
    Description: Cloudflare zone ID (Cloudflare for SaaS) used to create custom hostnames for tenant custom domains.
  CustomDomainTargetHost:
    Type: String
    Default: domains.jbay.uk
    Description: Hostname tenants CNAME their custom subdomain to (the Cloudflare for SaaS fallback origin, on the dedicated jbay.uk zone).
  CloudflareApexIpv4:
    Type: String
    Default: ""
    Description: Comma-separated static IPv4 addresses for apex proxying (Cloudflare for SaaS). Empty until procured; then apex domains use A records instead of ALIAS/flattening. See plans/SITE_OBJECT.md 2.6b.
  CloudflareApexIpv6:
    Type: String
    Default: ""
    Description: Comma-separated static IPv6 addresses for apex proxying. Empty until procured.
  ShortUrlHost:
    Type: String
    Default: go.jbay.uk
    Description: Public short-URL host served by the Cloudflare Worker on the jbay.uk zone (short links look like https://go.jbay.uk/{code}).

  EmailFromAddress:
    Type: String
    Default: support@juniorbay.net
    Description: Verified SES sender address for transactional email (receipts). Tenant business name is used as the display name and tenant support email as Reply-To.

Conditions:
  HasApiCustomDomain: !And
    - !Not [!Equals [!Ref ApiCustomDomainName, ""]]
    - !Not [!Equals [!Ref ApiCustomDomainCertificateArn, ""]]
  HasDashboardCustomDomain: !And
    - !Not [!Equals [!Ref DashboardCustomDomainName, ""]]
    - !Not [!Equals [!Ref DashboardCustomDomainCertificateArn, ""]]
  HasTestServeDomain: !And
    - !Not [!Equals [!Ref TestServeDomainName, ""]]
    - !Not [!Equals [!Ref TestServeCertificateArn, ""]]
  HasPreviewLiveDomain: !And
    - !Not [!Equals [!Ref PreviewLiveDomainName, ""]]
    - !Not [!Equals [!Ref PreviewCustomDomainCertificateArn, ""]]
  # Marketing homepage: HasHomepage builds the bucket+distribution (Phase 1, cloudfront.net only);
  # HasHomepageApex additionally claims the apex+www alias and Route 53 records (Phase 2 cutover).
  HasHomepage: !Equals [!Ref HomepageEnabled, "true"]
  HasHomepageApex: !And
    - !Equals [!Ref HomepageEnabled, "true"]
    - !Not [!Equals [!Ref HomepageCustomDomainName, ""]]
    - !Not [!Equals [!Ref HomepageCustomDomainCertificateArn, ""]]
  HasStripePlatformSecret: !Not [!Equals [!Ref StripePlatformSecretArn, ""]]
  HasCloudflareZone: !Not [!Equals [!Ref CloudflareZoneId, ""]]
  # Non-prod (test/dev) published pages must never be indexed. NOT applied in prod: there, the pages
  # distribution is the origin that custom domains reverse-proxy through, and a distribution-level noindex
  # header would leak onto indexable custom-domain pages.
  IsNonProd: !Not [!Equals [!Ref Environment, "prod"]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 1024
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_PREFIX: !Ref ProjectPrefix
        APP_CONFIG_TABLE: !Ref AppConfigTable
        STRIPE_KEYS_TABLE: !Ref StripeKeysTable
        PLATFORM_CONFIG_TABLE: !Ref PlatformConfigTable
        SHIPPING_CONFIG_TABLE: !Ref ShippingConfigTable
        TENANT_PROFILES_TABLE: !Ref TenantProfilesTable
        USER_PREFERENCES_TABLE: !Ref UserPreferencesTable
        USER_PROFILES_TABLE: !Ref UserProfilesTable
        NOTIFICATIONS_TABLE: !Ref NotificationsTable
        SERVICES_TABLE: !Ref ServicesTable
        LEADS_TABLE: !Ref LeadsTable
        REVIEWS_TABLE: !Ref ReviewsTable
        COLLECTIONS_TABLE: !Ref CollectionsTable
        CARTS_TABLE: !Ref CartsTable
        PLATFORM_PLANS_TABLE: !Ref PlatformPlansTable
        PLATFORM_BILLING_MODE: !Ref PlatformBillingMode
        TRIAL_PERIOD_DAYS: !Ref TrialPeriodDays
        # Per-stage (derived from existing domain params) so checkout + billing-return never point at the wrong
        # environment. Host-agnostic-by-mode (mode travels on the query); the release channel picks the host.
        PUBLIC_CHECKOUT_BASE_URL: !Sub "https://${ApiCustomDomainName}/checkout"
        PLATFORM_BILLING_RETURN_URL: !Sub "https://${DashboardCustomDomainName}"
        INVOICES_TABLE: !Ref InvoicesTable
        PRODUCTS_TABLE: !Ref ProductsTable
        OFFERS_TABLE: !Ref OffersTable
        COUPONS_TABLE: !Ref CouponsTable
        PAGES_TABLE: !Ref PagesTable
        SITES_TABLE: !Ref SitesTable
        # Registrable domain for tenant free-tier Sites (Zone B, always noindex). Read from config, never
        # hardcoded, so it can change without a code change. See plans/SITE_OBJECT.md §6.
        PLATFORM_HOSTING_DOMAIN: !Ref PlatformHostingDomain
        # Master switch for serving Sites on their free platform host. Off until the *.<PlatformHostingDomain>
        # Cloudflare Worker route is live; then flip per environment. See plans/PLATFORM_HOSTNAME_SERVING.md.
        PLATFORM_SERVING_ENABLED: !Ref PlatformServingEnabled
        CHECKOUT_SESSIONS_TABLE: !Ref CheckoutSessionsTable
        ORDERS_TABLE: !Ref OrdersTable
        REFUNDS_TABLE: !Ref RefundsTable
        LEDGER_TABLE: !Ref LedgerTable
        WEBHOOK_EVENTS_TABLE: !Ref WebhookEventsTable
        CUSTOMERS_TABLE: !Ref CustomersTable
        DOCUMENT_EVENTS_TABLE: !Ref DocumentEventsTable
        ROUTES_TABLE: !Ref RoutesTable
        EXPERIMENTS_TABLE: !Ref ExperimentsTable
        EMAIL_FROM_ADDRESS: !Ref EmailFromAddress
        TIER_POLICIES_TABLE: !Ref TierPoliciesTable
        MEDIA_TABLE: !Ref MediaTable
        THEMES_TABLE: !Ref ThemesTable
        LEGAL_PAGES_TABLE: !Ref LegalPagesTable
        PRODUCT_CATEGORIES_TABLE: !Ref ProductCategoriesTable
        CUSTOM_DOMAINS_TABLE: !Ref CustomDomainsTable
        CALENDAR_CONNECTIONS_TABLE: !Ref CalendarConnectionsTable
        SMS_ORIGINATION_SECRET_NAME: !Sub "jb/sms-origination/${Environment}"
        GOOGLE_OAUTH_SECRET_NAME: !Sub "jb/google-oauth/${Environment}"
        PAGES_BUCKET: !Ref PagesBucket
        PAGES_PREVIEW_BUCKET: !Ref PagesPreviewBucket
        MEDIA_BUCKET: !Ref MediaBucket
        TEMPLATES_BUCKET: !Ref TemplatesBucket
        BILLING_CONFIG_BUCKET: !Ref ConfigBucket
        BILLING_CONFIG_KEY: global_billing_config.json
        PAGES_DISTRIBUTION_ID: !Ref PagesDistribution
        PAGES_DISTRIBUTION_DOMAIN: !GetAtt PagesDistribution.DomainName
        PREVIEW_DISTRIBUTION_ID: !Ref PreviewDistribution
        PREVIEW_DISTRIBUTION_DOMAIN: !GetAtt PreviewDistribution.DomainName
        STRIPE_CLIENT_ID: !Ref StripeClientId
        STRIPE_CLIENT_ID_TEST: !Ref StripeClientIdTest
        STRIPE_CLIENT_ID_LIVE: !Ref StripeClientIdLive
        STRIPE_CONNECT_REDIRECT_URI: !Ref StripeConnectRedirectUri
        STRIPE_PLATFORM_SECRET_ARN: !Ref StripePlatformSecretArn
        PUBLIC_API_BASE_URL: !If
          - HasApiCustomDomain
          - !Sub "https://${ApiCustomDomainName}"
          - !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
        DASHBOARD_URL: !If
          - HasDashboardCustomDomain
          - !Sub "https://${DashboardCustomDomainName}"
          - !Sub "https://${DashboardDistribution.DomainName}"
        STRIPE_KEYS_KMS_KEY_ID: !Ref StripeKeysEncryptionKey
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClientId
        CLOUDFLARE_ZONE_ID: !Ref CloudflareZoneId
        CLOUDFLARE_API_TOKEN_SECRET_ARN: !If [HasCloudflareZone, !Ref CloudflareApiTokenSecret, ""]
        CUSTOM_DOMAIN_TARGET_HOST: !Ref CustomDomainTargetHost
        # Static A/AAAA IPs for apex proxying (plans/SITE_OBJECT.md §2.6b). Empty until Cloudflare apex
        # proxying is procured; then apex domains switch from ALIAS/flattening guidance to plain A/AAAA records.
        CLOUDFLARE_APEX_IPV4: !Ref CloudflareApexIpv4
        CLOUDFLARE_APEX_IPV6: !Ref CloudflareApexIpv6
        SHORT_URL_HOST: !Ref ShortUrlHost
    Tracing: Active

Resources:
  CloudflareApiTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasCloudflareZone
    Properties:
      Name: !Sub "${ProjectPrefix}-cloudflare-api-token-${Environment}"
      Description: Cloudflare API token (Zone:SSL and Certificates:Edit + Zone:Custom Hostname:Edit scope) used to manage custom hostnames for tenant custom domains. Populate the real value after deployment via `aws secretsmanager put-secret-value`.
      SecretString: "PLACEHOLDER-SET-VIA-put-secret-value"

  StripeKeysEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypt tenant Stripe secrets for ${ProjectPrefix}-${Environment}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  StripeKeysEncryptionAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectPrefix}-stripe-keys-${Environment}"
      TargetKeyId: !Ref StripeKeysEncryptionKey

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,PATCH,DELETE'"
        AllowHeaders: "'Content-Type,Authorization,X-Tenant-Id,X-Client-Id,X-Environment,X-Stripe-Mode'"
        AllowOrigin: "'*'"

  ApiCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasApiCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref ApiCustomDomainCertificateArn
      SecurityPolicy: TLS_1_2

  ApiCustomDomainBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasApiCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomain
      RestApiId: !Ref RestApi
      Stage: !Ref Environment

  ApiCustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApiCustomDomain
    Properties:
      HostedZoneName: !Ref ApiCustomDomainHostedZoneName
      Name: !Ref ApiCustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId

  # Per-stage host for the test-mode page viewer (TestPageServeFunction) — prod: prod-test.juniorbay.com.
  # Replaces the single, dev-only test.juniorbay.com so app(prod)+test-mode previews serve from prod, not dev
  # (plans/SERVE_HOST_SCHEME.md step 1). Regional API Gateway domain → this stack's RestApi; created only when set.
  TestServeCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasTestServeDomain
    Properties:
      DomainName: !Ref TestServeDomainName
      EndpointConfiguration:
        Types:
          - REGIONAL
      RegionalCertificateArn: !Ref TestServeCertificateArn
      SecurityPolicy: TLS_1_2

  TestServeCustomDomainBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasTestServeDomain
    Properties:
      DomainName: !Ref TestServeCustomDomain
      RestApiId: !Ref RestApi
      Stage: !Ref Environment

  TestServeCustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasTestServeDomain
    Properties:
      HostedZoneName: !Ref TestServeHostedZoneName
      Name: !Ref TestServeDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt TestServeCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt TestServeCustomDomain.RegionalHostedZoneId

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-health-${Environment}"
      CodeUri: src/
      Handler: handlers.health.lambda_handler
      Description: Health check for stripe-link.
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: GET

  ManifestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-manifest-${Environment}"
      CodeUri: src/
      Handler: handlers.manifest.lambda_handler
      Description: Runtime manifest for stripe-link resource isolation checks.
      Events:
        Manifest:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /manifest
            Method: GET

  AppConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-app-config-api-${Environment}"
      CodeUri: src/
      Handler: handlers.app_config.handler
      Description: Environment-level app configuration API.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppConfigTable
      Events:
        AppConfigGet:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /app-config/{config_key}
            Method: GET
        AppConfigPut:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /app-config/{config_key}
            Method: PUT
        AppConfigOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /app-config/{config_key}
            Method: OPTIONS

  OfferResolveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-offer-resolve-${Environment}"
      CodeUri: src/
      Handler: handlers.offers.resolve_handler
      Description: Resolves an offer against canonical product and price JSON.
      Events:
        ResolveOffer:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /offers/resolve
            Method: POST

  PriceCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-prices-api-${Environment}"
      CodeUri: src/
      Handler: handlers.prices.handler
      Description: Calculates customer-facing price amounts and fee breakdowns.
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ConfigBucket
        # Read the tenant profile so the fee tier is server-authoritative (tier_id: premium=pro -> 2%).
        - DynamoDBReadPolicy:
            TableName: !Ref TenantProfilesTable
      Events:
        PriceCalculate:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /prices/calculate
            Method: POST
        PriceCalculateOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /prices/calculate
            Method: OPTIONS

  BillingConnectCardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-billing-connect-card-${Environment}"
      CodeUri: src/
      Handler: handlers.billing.connect_card_handler
      Description: Returns tenant Stripe Connect card state from billing config and tenant tier.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TenantProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StripeKeysTable
        - S3ReadPolicy:
            BucketName: !Ref ConfigBucket
      Events:
        BillingConnectCard:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /billing/connect-card
            Method: GET
        BillingConnectCardOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /billing/connect-card
            Method: OPTIONS

  # Platform->tenant SaaS subscription: list plans, subscribe (Stripe Checkout subscription mode) and manage
  # (Stripe Billing Portal) on the PLATFORM account. See plans/SAAS_BILLING_PAYWALL.md.
  PlatformSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-platform-subscription-${Environment}"
      CodeUri: src/
      Handler: handlers.platform_subscription.handler
      Description: Platform->tenant SaaS subscription — plans list, subscribe (Checkout), manage (Billing Portal).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TenantProfilesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlatformPlansTable
        - !If
          - HasStripePlatformSecret
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref StripePlatformSecretArn
          - !Ref AWS::NoValue
      Events:
        PlatformBillingPlans:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/plans
            Method: GET
        PlatformBillingSubscribe:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/subscribe
            Method: POST
        PlatformBillingPortal:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/portal
            Method: POST
        PlatformBillingPlansOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/plans
            Method: OPTIONS
        PlatformBillingSubscribeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/subscribe
            Method: OPTIONS
        PlatformBillingPortalOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/portal
            Method: OPTIONS
        PlatformBillingCancel:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/cancel
            Method: POST
        PlatformBillingCancelOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/cancel
            Method: OPTIONS
        PlatformBillingResume:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/resume
            Method: POST
        PlatformBillingResumeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /platform-billing/resume
            Method: OPTIONS

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-products-api-${Environment}"
      CodeUri: src/
      Handler: handlers.products.handler
      Description: JSON-first products API.
      Environment:
        Variables:
          # Auto-sync on save fires this Lambda asynchronously (plans/SALES_FUNNELS.md P1.5).
          PRODUCT_SYNC_FUNCTION: !Sub "${ProjectPrefix}-product-sync-${Environment}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        # Records category usage on save (recording a distinct tenant's use of a category).
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductCategoriesTable
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt ProductSyncFunction.Arn
      Events:
        ProductsList:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products
            Method: GET
        ProductsCreate:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products
            Method: POST
        ProductsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products
            Method: OPTIONS
        ProductsGet:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{product_id}
            Method: GET
        ProductOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{product_id}
            Method: OPTIONS
        ProductStatusUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{product_id}/status
            Method: PATCH
        ProductStatusOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /products/{product_id}/status
            Method: OPTIONS

  LeadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-leads-api-${Environment}"
      CodeUri: src/
      Handler: handlers.leads.handler
      Description: Lead capture — public ingest + tenant-scoped read/manage.
      Policies:
        # Entitlement gate reads the tenant's denormalized entitlements to gate this feature on the plan.
