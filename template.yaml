  SitesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-sites-api-${Environment}"
      CodeUri: src/
      Handler: handlers.sites.handler
      Description: JSON-first Sites API (the public aggregate root — plans/SITE_OBJECT.md).
      Policies:
        # Entitlement gate reads the tenant's denormalized entitlements to gate this feature on the plan.
        - DynamoDBReadPolicy:
            TableName: !Ref TenantProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        # Read pages for editor/nav resolution; write to re-put (re-publish) the Site's pages when a custom
        # domain first verifies, so verified-domain-gated publish work (funnel + /sale slugs, canonical/robots)
        # attaches for pages published before verification.
        - DynamoDBCrudPolicy:
            TableName: !Ref PagesTable
        # Custom-domain bridge: write the resolver index; CRUD on stripe-keys because eligibility self-heal
        # captures live Connect verification back onto the doc.
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomDomainsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StripeKeysTable
        - !If
          - HasCloudflareZone
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref CloudflareApiTokenSecret
          - !Ref AWS::NoValue
        # Read the platform Stripe secret to pull a connected account's live verification status.
        - !If
          - HasStripePlatformSecret
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref StripePlatformSecretArn
          - !Ref AWS::NoValue
      Events:
        SitesConnectDomain:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/domain
            Method: POST
        SitesCheckDomain:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/domain/check
            Method: POST
        SitesDisconnectDomain:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/domain
            Method: DELETE
        SitesList:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites
            Method: GET
        SitesCreate:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites
            Method: POST
        SitesSubdomainCheck:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/subdomain
            Method: GET
        SitesGet:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}
            Method: GET
        SitesDelete:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}
            Method: DELETE
        SiteStatus:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/status
            Method: PATCH
        SiteHomepage:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/homepage
            Method: POST
        SiteAttachPage:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/pages
            Method: POST
        SiteDetachPage:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /sites/{site_id}/pages
