  PagePublishFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-page-publish-${Environment}"
      CodeUri: src/
      Handler: handlers.page_publish.handler
      Description: Renders page documents from the PagesTable stream into preview, test, and published page artifacts.
      Timeout: 60
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OffersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ServicesTable
        # Publishing a funnel entry page attaches its funnel pages to the Site and refreshes the domain-index
        # route table so the whole funnel routes on the custom domain (plans/SITE_OBJECT.md §2.6) — needs write.
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomDomainsTable
        # Publishing registers a code->page route (and unpublishing removes it) so the shareable test link
        # test.juniorbay.com/published/{short_code} resolves (plans/SALES_FUNNELS.md Phase B).
        - DynamoDBCrudPolicy:
            TableName: !Ref RoutesTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        # A page's collection-embed grids resolve their cards from the referenced Collection at publish
        # (plans/SITE_COLLECTIONS.md P1) — read-only.
        - DynamoDBReadPolicy:
            TableName: !Ref CollectionsTable
        # On-page BNPL messaging (plans/BNPL_PAYMENT_METHODS.md P3) reads the tenant's publishable key + enabled
        # installment methods from the stripe_keys doc at publish — read-only.
        - DynamoDBReadPolicy:
            TableName: !Ref StripeKeysTable
        # Publishing a page that embeds a manual collection auto-publishes its selected draft members
        # (plans/SITE_COLLECTIONS.md) — needs to READ the members and WRITE their published status back. The
        # handler otherwise gets pages only from the stream, so this is the only direct PagesTable access.
        - DynamoDBCrudPolicy:
            TableName: !Ref PagesTable
        - S3CrudPolicy:
            BucketName: !Ref PagesBucket
        - S3CrudPolicy:
            BucketName: !Ref PagesPreviewBucket
        - Statement:
            Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
            Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PagesDistribution}"
      Events:
        PagesChanged:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PagesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

