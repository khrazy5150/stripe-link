  PagesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectPrefix}-pages-oac-${Environment}"
        Description: !Sub "OAC for ${ProjectPrefix} published pages ${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Emits X-Robots-Tag noindex,nofollow,noarchive on non-prod published pages so test pages can't be indexed
  # (belt-and-suspenders over the noindex meta, and covers noarchive + every response). Created ONLY in
  # non-prod so it can never attach to the prod pages distribution (the custom-domain proxy origin).
  PagesNoIndexHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: IsNonProd
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectPrefix}-pages-noindex-${Environment}"
        Comment: Keep non-prod published pages out of search engines.
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: "noindex, nofollow, noarchive"
              Override: true

  PagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectPrefix} stripe-link published pages ${Environment}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: PagesS3Origin
            DomainName: !GetAtt PagesBucket.RegionalDomainName
            OriginAccessControlId: !Ref PagesOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: PagesS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Non-prod (test/dev) = Managed-CachingDisabled so published pages are always fresh for iteration;
          # prod = Managed-CachingOptimized for edge performance (tuned separately).
          CachePolicyId: !If [IsNonProd, "4135ea2d-6df8-44a3-9df3-4b5a84be39ad", "658327ea-f89d-4fab-a63d-7e88639e58f6"]
          ResponseHeadersPolicyId: !If [IsNonProd, !Ref PagesNoIndexHeadersPolicy, !Ref "AWS::NoValue"]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  PagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PagesBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PagesDistribution}"

  PreviewOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectPrefix}-pages-preview-oac-${Environment}"
        Description: !Sub "OAC for ${ProjectPrefix} preview pages ${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PreviewDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectPrefix} stripe-link preview pages ${Environment}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        # Branded live-preview host ({stage}-live.juniorbay.com) so live-mode draft previews aren't the raw
        # *.cloudfront.net name. Uses the us-east-1 wildcard cert. Empty param (none set) -> no alias, default cert.
        Aliases: !If
          - HasPreviewLiveDomain
          - [!Ref PreviewLiveDomainName]
          - !Ref AWS::NoValue
        Origins:
          - Id: PreviewS3Origin
            DomainName: !GetAtt PagesPreviewBucket.RegionalDomainName
            OriginAccessControlId: !Ref PreviewOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: PreviewS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
        ViewerCertificate: !If
          - HasPreviewLiveDomain
          - AcmCertificateArn: !Ref PreviewCustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  PagesPreviewBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PagesPreviewBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PagesPreviewBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PreviewDistribution}"

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectPrefix}-dashboard-oac-${Environment}"
        Description: !Sub "OAC for ${ProjectPrefix} dashboard ${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Keeps the admin dashboard out of search engines. X-Robots-Tag is honored by crawlers for every path and
  # content type (unlike a <meta> tag or robots.txt), so it covers the whole SPA. Applied in every environment
  # — the dashboard is a login-gated admin tool that should never be indexed.
  DashboardNoIndexHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectPrefix}-dashboard-noindex-${Environment}"
        Comment: Emit X-Robots-Tag noindex,nofollow,noarchive on the admin dashboard.
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: "noindex, nofollow, noarchive"
              Override: true

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectPrefix} stripe-link dashboard ${Environment}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDashboardCustomDomain
          - - !Ref DashboardCustomDomainName
          - !Ref AWS::NoValue
        Origins:
          - Id: DashboardS3Origin
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !Ref DashboardOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: DashboardS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref DashboardNoIndexHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate: !If
          - HasDashboardCustomDomain
          - AcmCertificateArn: !Ref DashboardCustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}"

  DashboardCustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDashboardCustomDomain
    Properties:
      HostedZoneName: !Ref DashboardCustomDomainHostedZoneName
      Name: !Ref DashboardCustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DashboardDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # Route 53 alias for the canonical {stage}-live host (dev-live / prod-live.juniorbay.com) -> this stack's preview
  # dist. HostedZoneId Z2FDTNDATAQYW2 is CloudFront's fixed global zone id. Created only when the param is set.
  PreviewLiveDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasPreviewLiveDomain
    Properties:
      HostedZoneName: !Ref PreviewCustomDomainHostedZoneName
      Name: !Ref PreviewLiveDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt PreviewDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ---- Public marketing homepage (juniorbay.com apex) — see plans/HOMEPAGE.md ----
  # Isolated bucket + distribution; marketing copy is synced by deploy/deploy-homepage.sh (no stack deploy).
  HomepageBucket:
    Type: AWS::S3::Bucket
    Condition: HasHomepage
    Properties:
      BucketName: !Sub "${ProjectPrefix}-homepage-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration: *PrivateBucketAccess
      BucketEncryption: *BucketEncryption
      VersioningConfiguration:
        Status: Enabled

  HomepageOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasHomepage
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectPrefix}-homepage-oac-${Environment}"
        Description: !Sub "OAC for ${ProjectPrefix} marketing homepage ${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  HomepageDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasHomepage
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectPrefix} stripe-link marketing homepage ${Environment}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        # Phase 2 (apex set): claim juniorbay.com + www. Phase 1 (apex empty): cloudfront.net only.
        Aliases: !If
          - HasHomepageApex
          - - !Ref HomepageCustomDomainName
            - !Sub "www.${HomepageCustomDomainName}"
          - !Ref AWS::NoValue
        Origins:
          - Id: HomepageS3Origin
            DomainName: !GetAtt HomepageBucket.RegionalDomainName
            OriginAccessControlId: !Ref HomepageOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          # /legal/* is proxied to the API so Terms/Privacy live at the apex (one source of truth).
          - Id: HomepageLegalApiOrigin
            DomainName: !Ref ApiCustomDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: HomepageS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CacheBehaviors:
          # /fonts/* are shared brand assets (the fonts.juniorbay.com CSS points every surface here). Fonts are
          # CORS-gated by browsers, so cross-origin pages (the dashboard on app/sandbox.juniorbay.com) need
          # Access-Control-Allow-Origin — Managed-SimpleCORS adds it.
          - PathPattern: /fonts/*
            TargetOriginId: HomepageS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
            ResponseHeadersPolicyId: 60669652-455b-4ae9-85a4-c4c02393f86c  # Managed-SimpleCORS
          # The support form posts same-origin to /support/contact -> the API (no CORS). All methods + the
          # AllViewerExceptHostHeader origin-request policy so the JSON body and Content-Type reach the origin.
          - PathPattern: /support/contact
            TargetOriginId: HomepageLegalApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          # Forward /legal/* to the legal API. Managed-CachingDisabled forwards no Host header, so the
          # origin receives Host=<ApiCustomDomainName> (required for the API Gateway custom-domain mapping).
          - PathPattern: /legal/*
            TargetOriginId: HomepageLegalApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate: !If
          - HasHomepageApex
          - AcmCertificateArn: !Ref HomepageCustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  HomepageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasHomepage
    Properties:
      Bucket: !Ref HomepageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${HomepageBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${HomepageDistribution}"

  # NOTE: The apex + www DNS (A and AAAA alias records) are managed directly via Route 53 at cutover, not
  # here — the pre-existing records were created outside this stack, and the apex needs both A and AAAA.
  # HomepageDistribution claims the apex/www CNAME aliases (HasHomepageApex); the alias A/AAAA records point
  # at it in the shared juniorbay.com zone.

