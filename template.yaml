    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-post-checkout-${Environment}"
      CodeUri: src/
      Handler: handlers.post_checkout.handler
      Description: Redirects post-checkout funnel hops. Sequence-indexed upsell routing derived from the offer's post_purchase_plan (reads Offer + Product, never charges), falling back to legacy page-step routing. Never touches Stripe state.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PagesTable
        # Read the owning Site so a funnel hop redirects to the custom domain slug, not the platform artifact.
        - DynamoDBReadPolicy:
            TableName: !Ref SitesTable
        # Derive the post-purchase plan (which upsell screens exist, in order) from the offer + its products.
        - DynamoDBReadPolicy:
            TableName: !Ref OffersTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        PostCheckoutNext:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
