          KeyType: RANGE

  StripeKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Renamed -v2 so CloudFormation can add the composite `mode` sort key in one clean deploy: a key-schema
      # change is a replacement, and CFN cannot replace a custom-named resource in place. The app references this
      # only via !Ref, so the physical name is internal (plans/STRIPE_MODE_DECOUPLING.md P6).
      TableName: !Sub "${ProjectPrefix}-stripe-keys-v2-${Environment}"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      # Composite key holds BOTH Stripe modes for a tenant in this one per-deployment table
      # (mode = SK), replacing the legacy two-shared-table design (plans/STRIPE_MODE_DECOUPLING.md).
      AttributeDefinitions:
        - AttributeName: tenant_id
          AttributeType: S
        - AttributeName: mode
          AttributeType: S
      KeySchema:
        - AttributeName: tenant_id
          KeyType: HASH
        - AttributeName: mode
          KeyType: RANGE

