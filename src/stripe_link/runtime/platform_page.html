<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior Bay - Activate Your Store</title>
<link rel="icon" type="image/x-icon" href="https://images.juniorbay.com/icon/favicon.png">
<link rel="dns-prefetch" href="//fonts.juniorbay.com">
<link rel="preconnect" href="https://fonts.juniorbay.com" crossorigin>
<link href="https://fonts.juniorbay.com/?family=Aileron:400,600&family=Ubuntu+Titling:700&family=Quicksand:400,700&display=swap&v=20260409e" rel="stylesheet">
<style>
  :root {
    --bg: #0b5294;
    --panel: #104163;
    --rim: rgba(255,255,255,0.12);
    --muted: rgba(255,255,255,0.45);
    --ghost: rgba(255,255,255,0.65);
    --body: rgba(255,255,255,0.88);
    --bright: #ffffff;
    --orange: #ff8309;
    --cta: #ffce47;
    --teal: #4dd9c0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--body);
    font-family: 'Aileron', sans-serif;
    font-weight: 400;
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 10%, rgba(255,255,255,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 90%, rgba(0,0,0,0.28) 0%, transparent 60%);
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
  }

  .orb-1 {
    width: 560px;
    height: 560px;
    top: -180px;
    left: -120px;
    background: radial-gradient(circle, rgba(255,131,9,0.16) 0%, transparent 70%);
    animation: drift1 20s ease-in-out infinite alternate;
  }

  .orb-2 {
    width: 480px;
    height: 480px;
    bottom: -120px;
    right: -80px;
    background: radial-gradient(circle, rgba(77,217,192,0.12) 0%, transparent 70%);
    animation: drift2 24s ease-in-out infinite alternate;
  }

  @keyframes drift1 {
    from { transform: translate(0, 0); }
    to { transform: translate(50px, 40px); }
  }

  @keyframes drift2 {
    from { transform: translate(0, 0); }
    to { transform: translate(-40px, -50px); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.65); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
    text-decoration: none;
  }

  .logo-img {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: block;
  }

  .logo-text {
    font-family: 'Ubuntu Titling', sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--bright);
    letter-spacing: 0.01em;
    line-height: 1;
  }

  .logo-text .bay { color: var(--orange); }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--rim);
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.07) inset,
      0 40px 80px rgba(0,0,0,0.35),
      0 0 0 1px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
  }

  .card-accent {
    height: 3px;
    background: linear-gradient(90deg, var(--orange) 0%, #ffb347 55%, transparent 100%);
  }

  .card-body { padding: 44px 44px 36px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 16px;
  }

  .eyebrow-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    animation: pulseDot 2.5s ease-in-out infinite;
  }

  .notice {
    margin-bottom: 18px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255,131,9,0.12);
    border: 1px solid rgba(255,131,9,0.28);
    color: var(--body);
    font-size: 13px;
    line-height: 1.5;
  }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 400;
    color: var(--bright);
    line-height: 1.14;
    letter-spacing: -0.6px;
    margin-bottom: 14px;
  }

  h1 em {
    font-family: 'Aileron', sans-serif;
    font-style: normal;
    color: var(--orange);
    font-weight: 700;
  }

  .subtitle {
    font-size: 15px;
    color: var(--ghost);
    line-height: 1.65;
    margin-bottom: 32px;
  }

  .plan-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  .plan-card {
    position: relative;
    padding: 22px 22px 18px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .plan-card.selected {
    border-color: rgba(255,206,71,0.55);
    box-shadow: 0 0 0 1px rgba(255,206,71,0.18) inset;
  }

  .plan-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,131,9,0.18);
    border: 1px solid rgba(255,131,9,0.3);
    color: var(--orange);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .plan-head {
    margin-bottom: 12px;
    padding-right: 90px;
  }

  .plan-name {
    font-family: 'Quicksand', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
    color: var(--bright);
    margin-bottom: 6px;
  }

  .plan-tagline {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ghost);
  }

  .pricing {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    margin-bottom: 6px;
  }

  .price-amount {
    font-size: 58px;
    font-weight: 700;
    color: var(--bright);
    line-height: 1;
    letter-spacing: -3px;
  }

  .price-currency {
    font-size: 26px;
    font-weight: 700;
    color: var(--ghost);
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  .price-period {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .price-note {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
    padding: 22px 24px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(0,0,0,0.25);
    border-radius: 14px;
  }

  .features li {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 14px;
    color: var(--body);
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .features li:nth-child(1) { animation-delay: 0.55s; }
  .features li:nth-child(2) { animation-delay: 0.65s; }
  .features li:nth-child(3) { animation-delay: 0.75s; }
  .features li:nth-child(4) { animation-delay: 0.85s; }
  .features li:nth-child(5) { animation-delay: 0.95s; }

  .features.compact {
    gap: 10px;
    margin-bottom: 18px;
    padding: 16px 16px 14px;
    background: rgba(255,255,255,0.03);
  }

  .features.compact li {
    opacity: 1;
    animation: none;
    font-size: 13px;
    line-height: 1.4;
    align-items: flex-start;
  }

  .check {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(77,217,192,0.15);
    border: 1px solid rgba(77,217,192,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check svg {
    width: 9px;
    height: 9px;
    stroke: var(--teal);
    stroke-width: 2.5;
  }

  .btn-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 28px;
    border: none;
    border-radius: 12px;
    background: var(--cta);
    color: #1c1000;
    font-family: 'Aileron', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow: 0 4px 24px rgba(255,206,71,0.38), 0 1px 0 rgba(255,255,255,0.32) inset;
  }

  a.btn {
    text-decoration: none;
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 50%);
    border-radius: inherit;
    pointer-events: none;
  }

  .btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s ease;
    pointer-events: none;
  }

  .btn:hover:not([disabled]) {
    transform: translateY(-2px);
    background: #ffd55e;
    box-shadow: 0 8px 36px rgba(255,206,71,0.48), 0 1px 0 rgba(255,255,255,0.32) inset;
  }

  .btn.selected {
    background: #ffd55e;
  }

  .btn:hover:not([disabled])::after { left: 160%; }

  .btn:active:not([disabled]) {
    transform: translateY(0);
    box-shadow: 0 2px 12px rgba(255,206,71,0.25);
  }

  .btn[disabled] {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .btn-icon {
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .btn:hover:not([disabled]) .btn-icon { transform: translateX(3px); }

  .btn.loading .btn-text,
  .btn.loading .btn-icon { opacity: 0; }

  .btn-spinner {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2.5px solid rgba(28,16,0,0.25);
    border-top-color: #1c1000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    opacity: 0;
    pointer-events: none;
  }

  .btn.loading .btn-spinner { opacity: 1; }

  .card-footer {
    padding: 18px 44px 26px;
    border-top: 1px solid rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .empty-state {
    margin-bottom: 18px;
    padding: 16px 18px;
    border-radius: 14px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--ghost);
    font-size: 14px;
    line-height: 1.5;
  }

  .trust-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .trust-badge svg {
    width: 13px;
    height: 13px;
    stroke: var(--muted);
    flex-shrink: 0;
  }

  .below-card {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.65s forwards;
  }

  .below-card a {
    color: var(--ghost);
    text-decoration: underline;
    text-decoration-color: rgba(255,255,255,0.2);
    transition: color 0.2s;
  }

  .below-card a:hover {
    color: var(--bright);
    text-decoration-color: rgba(255,255,255,0.5);
  }

  @media (max-width: 560px) {
    .page {
      justify-content: flex-start;
      padding: 24px 14px 32px;
    }

    .logo {
      margin-bottom: 24px;
      gap: 10px;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 9px;
    }

    .logo-text { font-size: 26px; }

    .card {
      max-width: 100%;
      border-radius: 18px;
    }

    .card-body { padding: 28px 20px 22px; }

    .eyebrow {
      font-size: 10px;
      margin-bottom: 14px;
    }

    .notice {
      font-size: 12px;
      margin-bottom: 16px;
      padding: 12px 14px;
    }

    h1 {
      font-size: clamp(24px, 9vw, 32px);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .plan-card {
      padding: 18px 16px 16px;
    }

    .plan-head {
      padding-right: 0;
      margin-bottom: 10px;
    }

    .plan-badge {
      position: static;
      display: inline-flex;
      margin-bottom: 10px;
    }

    .plan-name {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .pricing {
      gap: 3px;
      margin-bottom: 4px;
    }

    .price-amount {
      font-size: 50px;
      letter-spacing: -2px;
    }

    .price-currency {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .price-period {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .price-note {
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .features {
      gap: 10px;
      padding: 18px 16px;
      margin-bottom: 24px;
    }

    .features li {
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.4;
    }

    .btn {
      padding: 16px 22px;
      font-size: 14px;
    }

    .card-footer {
      padding: 16px 18px 20px;
      justify-content: flex-start;
      gap: 10px 14px;
    }

    .trust-badge {
      width: calc(50% - 7px);
      min-width: 0;
      font-size: 11px;
    }

    .below-card {
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.5;
      padding: 0 10px;
    }
  }

  @media (max-width: 400px) {
    .page { padding: 20px 10px 28px; }
    .logo-text { font-size: 22px; }
    .card-body { padding: 24px 16px 20px; }
    h1 { font-size: 22px; }
    .price-amount { font-size: 44px; }

    .card-footer {
      flex-direction: column;
      align-items: flex-start;
    }

    .trust-badge { width: 100%; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<main class="page">
  <a class="logo" href="__LOGO_URL__">
    <img class="logo-img" src="https://images.juniorbay.com/icon/favicon.png" alt="Junior Bay icon" width="44" height="44">
    <span class="logo-text">Junior <span class="bay">Bay</span></span>
  </a>

  <div class="card">
    <div class="card-accent"></div>

    <div class="card-body">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        __EYEBROW__
      </div>

      <div class="notice">__NOTICE__</div>

      <h1>__HEADLINE__</h1>

      <p class="subtitle">__SUBTITLE__</p>

      <div class="plan-grid">__PLAN_CARDS__</div>
      __ACTION_SECTION__
    </div>

    <div class="card-footer">__TRUST__</div>
  </div>

  __BELOW_CARD__
</main>

</body>
</html>
